<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="opencode-egress sunburst logo">
  <defs>
    <polygon id="rayL" points="64,10 75,44 53,44"/>
    <polygon id="rayS" points="64,24 70,44 58,44"/>
  </defs>
  <rect width="128" height="128" fill="#f8f3e6"/>
  <g stroke="#1a1612" stroke-width="3" stroke-linejoin="round">
    <!-- uzun isinlar: 0/60/120... — 0 (ust) aktif cikis -->
    <use href="#rayL" fill="#ff5c39" transform="rotate(0 64 64)"/>
    <use href="#rayL" fill="#1a1612" transform="rotate(60 64 64)"/>
    <use href="#rayL" fill="#1a1612" transform="rotate(120 64 64)"/>
    <use href="#rayL" fill="#1a1612" transform="rotate(180 64 64)"/>
    <use href="#rayL" fill="#1a1612" transform="rotate(240 64 64)"/>
    <use href="#rayL" fill="#1a1612" transform="rotate(300 64 64)"/>
    <!-- kisa isinlar: 30/90/150... -->
    <use href="#rayS" fill="#ccf73a" transform="rotate(30 64 64)"/>
    <use href="#rayS" fill="#ccf73a" transform="rotate(90 64 64)"/>
    <use href="#rayS" fill="#ccf73a" transform="rotate(150 64 64)"/>
    <use href="#rayS" fill="#ccf73a" transform="rotate(210 64 64)"/>
    <use href="#rayS" fill="#ccf73a" transform="rotate(270 64 64)"/>
    <use href="#rayS" fill="#ccf73a" transform="rotate(330 64 64)"/>
  </g>
  <circle cx="64" cy="64" r="25" fill="#ccf73a" stroke="#1a1612" stroke-width="6"/>
  <circle cx="64" cy="64" r="9" fill="#1a1612"/>
</svg>